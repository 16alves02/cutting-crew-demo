<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página não encontrada | Protótipo</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#111111" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-content: center; padding: 2rem 1.25rem; background: #111; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { max-width: 36rem; }
  p.n { margin: 0; font: 900 clamp(7rem, 32vw, 14rem)/.8 "Arial Narrow", "Roboto Condensed", Impact, sans-serif; }
  h1 { margin: 1.25rem 0 .5rem; font: 800 clamp(2rem, 7vw, 3rem)/1 "Arial Narrow", "Roboto Condensed", Impact, sans-serif; text-transform: uppercase; }
  p { color: #c8c8c8; margin: 0 0 1.75rem; }
  a { display: inline-flex; align-items: center; min-height: 3.25rem; padding: .8rem 1.6rem; border: 2px solid #fff; color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; }
  a:hover { background: #fff; color: #111; }
  a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="n" aria-hidden="true">404</p>
  <h1>Página não encontrada</h1>
  <p>Esta página não existe. Volta ao início para ver os serviços e marcar.</p>
  <a href="/">Voltar ao início</a>
</main>
</body>
</html>
